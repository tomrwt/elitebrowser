<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galactic Chart</title>

    <style>
        .wrapper {
            display: grid;
            grid-template-columns: 430px 84px;
            
        }
        
        #top {
            grid-column-start: 1;
            grid-column-end: 3;
            grid-row-start: 1;
            grid-row-end: 2;
        }
        #map {
            grid-column-start: 1;
            grid-column-end: 3;
            grid-row-start: 2;
            grid-row-end: 3;
            border-width: 1px;
            border-style: solid;    
            border-color: white;

        }
        #sysDatScr {
            grid-column-start: 1;
            grid-column-end: 2;
            grid-row-start: 3;
            grid-row-end: 4;
        }
        #but {
            grid-column-start: 2;
            grid-column-end: 3;
            grid-row-start: 3;
            grid-row-end: 4;
            justify-self: right;
        }


        body {background-color: rgb(0, 0, 0); color: rgb(255, 255, 255); font-family: monospace; }
        .screen   {text-align: center;width: 512px; align; border-style: solid; border-width: 1px;}
        p {font-size: 18px}
        h1 {color: rgb(255, 255, 255); text-align: center;width: 512px; align; border-style: solid; border-width: 1px;}
        #pointSystem {color: red;}
        tr   {font-size: 8px}
        button {font-family: sans-serif}
        #sysTable {color: rgb(255, 255, 255);}
        </style>

</head> 
<body>
    <div class="wrapper">

    <div id="top">
        <h1 class="screen" id="title">GALACTIC CHART 1</h1> 
    </div>
    <div id="map">
    <canvas id="galCanvas" width="512" height="256" ></canvas>
    </div>
    <div id="but">

    </div>
<!--    <p id="pointSystem"></p>*/   -->



    </div>



</body>

    






</html>
