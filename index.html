<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galactic Chart</title>

    <style>

        body {background-color: rgb(0, 0, 0); color: rgb(255, 255, 255); font-family: 'Courier New', Courier, monospace }
        



        .wrapper {
            display: grid;
            grid-template-columns: minmax(240px, 430px) 84px;
            
        }
        
        #top {
            grid-column-start: 1;
            grid-column-end: 3;
            grid-row-start: 1;
            grid-row-end: 2;
            text-align: center; border-style: solid; border-width: 1px;
            padding-top: 0px;
        }
        #map {
            grid-column-start: 1;
            grid-column-end: 3;
            grid-row-start: 2;
            grid-row-end: 3;
            border-width: 1px;
            border-style: solid;    
            border-color: white;

        }
        #sysDatScr {
            grid-column-start: 1;
            grid-column-end: 2;
            grid-row-start: 3;
            grid-row-end: 4;
        }
        #but {
            grid-column-start: 2;
            grid-column-end: 3;
            grid-row-start: 3;
            grid-row-end: 4;
            justify-self: right;
        }


      
        p {font-size: 18px}
        h1 {margin: 8px;}
        #pointSystem {color: red;}
        tr   {font-size: 8px}
        button {font-family: sans-serif}
        #sysTable {color: rgb(255, 255, 255);}
        </style>

</head> 
<body>
    <div class="wrapper">

    <div id="top">
        <h1 class="screen" id="title">GALACTIC CHART 1</h1> 
    </div>
    <div id="map">
    <canvas id="galCanvas" width="512" height="256" ></canvas>
    </div>
    <div id="but">
    <button id="nextGal" type="button">next galaxy</button>
    </div>
<!--    <p id="pointSystem"></p>*/   -->

    <div id="sysDatScr">
        <h2 id = "sysDatTitle"></h2>
        <p id = "sysDatText"></p>
    </div>

    </div>



</body>

<script src="script.js"></script>






</html>
