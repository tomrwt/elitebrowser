<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galactic Chart</title>

    <style>

        body {background-color: rgb(0, 0, 0); color: rgb(255, 255, 255); font-family: 'Courier New', Courier, monospace }
        

        .wrapper {
            display: flex;
            flex-wrap: wrap;

        }

        .wrapper > * {
            
        }


        #top_map_but > * {

        }

        #top {
            border: 1px white solid;
            text-align: center;
            font-size: 8px;
        }

        #map {
            border: 1px white solid;
        }

        #nextGal {
            align-content:last baseline;
         }

         #but {
            justify-content: right;
            display: flex;
         }


        #sysDatScr > * {
            font-size: 18px;
            margin-top: 0px;
            margin-left: 8px;
        }

        p {font-size: 12px}
        h1 {margin: 8px;}
        #pointSystem {color: red;}
        tr   {font-size: 8px}
        button {font-family: sans-serif;}
        #sysTable {color: rgb(255, 255, 255);}
        
        @media screen and (min-width: 600px) {
        .screen {font-size: 18px};
        h2 {font-size: 18px;} 
        
       
        p {font-size: 16px;}
        }

      

        </style>

</head> 
<body>
    
<div class="wrapper">

<div id="top_map_but">
   
    <div id="top">
        <h1 class="screen" id="title">GALACTIC CHART 1</h1> 
    </div>
  
    <div id="map">
    <canvas id="galCanvas" width="512" height="256" ></canvas>
    </div>

    <div id="but">
    <button id="nextGal" type="button">next galaxy</button>
    </div>
</div>

<div id="sysDatScr">
        <h2 id = "sysDatTitle"></h2>
        <p id = "sysDatText"></p>
</div>

</div>

</body>

<script src="script.js"></script>






</html>
